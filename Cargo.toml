[package]
name = "shire"
version = "0.6.0"
edition = "2024"
description = "One index to rule them all — Search, Hierarchy, Index, Repo Explorer, a monorepo MCP-first indexer"
license = "Apache-2.0"
keywords = ["monorepo", "mcp", "index", "search"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "shire"
path = "src/lib.rs"

[[bin]]
name = "shire"
path = "src/main.rs"

[[bin]]
name = "autoresearch"
path = "src/bin/autoresearch.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.36", features = ["bundled", "backup"] }
rmcp = { version = "0.3", features = ["server", "transport-io"] }
schemars = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
quick-xml = { version = "0.37", features = ["serialize"] }
regex = "1"
glob = "0.3"
walkdir = "2"
ignore = "0.4"
tokio = { version = "1", features = ["full"] }
rayon = "1"
anyhow = "1"
chrono = "0.4"
sha2 = "0.10"
streaming-iterator = "0.1"
tree-sitter = "0.25"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.25"
tree-sitter-go = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-proto = "0.2"
tree-sitter-java = "0.23.5"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-ruby = "0.23.1"
shellexpand = "3"
fastembed = { version = "4", optional = true }
sqlite-vec = { version = "0.1", optional = true }
zerocopy = { version = "0.8", features = ["derive"], optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
indicatif = "0.17"
dialoguer = "0.11"
console = "0.15"
which = "7"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23.4"
tree-sitter-c-sharp = "0.23.1"
tree-sitter-php = "0.24"
tree-sitter-scala = "0.25"
tree-sitter-elixir = "0.3"
tree-sitter-zig = "1.1"
tree-sitter-swift = "0.7"
tree-sitter-bash = "0.25"
tree-sitter-r = "1.2"
tree-sitter-haskell = "0.23.1"
tree-sitter-yaml = "0.7"
tree-sitter-sequel = "0.3"
tree-sitter-hcl = { git = "https://github.com/tree-sitter-grammars/tree-sitter-hcl", rev = "64ad62785d44" }
tree-sitter-toml-ng = "0.7"
ts-parser-perl = "1.0"
tree-sitter-dart = "0.1"
tree-sitter-ocaml = "0.24.2"
tree-sitter-lua = "0.5"
tree-sitter-clojure-orchard = "0.2"
tree-sitter-erlang = "0.15"
tree-sitter-julia = "0.23"
tree-sitter-gleam = "1.0"
tree-sitter-odin = "1.3"
tree-sitter-nix = "0.3"
tree-sitter-nim = { git = "https://github.com/alaviss/tree-sitter-nim", rev = "3878440d9398" }

[features]
default = ["rag"]
rag = ["dep:fastembed", "dep:sqlite-vec", "dep:zerocopy"]

[dev-dependencies]
tempfile = "3"
rusqlite = { version = "0.36", features = ["bundled"] }
