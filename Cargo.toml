[package]
name = "shire"
version = "0.2.1"
edition = "2024"
description = "One index to rule them all — Search, Hierarchy, Index, Repo Explorer, a monorepo MCP-first indexer"
license = "Apache-2.0"
keywords = ["monorepo", "mcp", "index", "search"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "shire"
path = "src/lib.rs"

[[bin]]
name = "shire"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.36", features = ["bundled", "backup"] }
rmcp = { version = "0.3", features = ["server", "transport-io"] }
schemars = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
quick-xml = { version = "0.37", features = ["serialize"] }
regex = "1"
glob = "0.3"
walkdir = "2"
ignore = "0.4"
tokio = { version = "1", features = ["full"] }
rayon = "1"
anyhow = "1"
chrono = "0.4"
sha2 = "0.10"
streaming-iterator = "0.1"
tree-sitter = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-go = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-python = "0.23"
tree-sitter-proto = "0.2"
tree-sitter-java = "0.23"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-ruby = "0.23"
shellexpand = "3"
fastembed = { version = "4", optional = true }
sqlite-vec = { version = "0.1", optional = true }
zerocopy = { version = "0.8", features = ["derive"], optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
indicatif = "0.17"
dialoguer = "0.11"
which = "7"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-php = "0.23"
tree-sitter-scala = "0.24"
tree-sitter-elixir = "0.3"
tree-sitter-zig = "1.1"
tree-sitter-swift = "0.6"

[features]
default = ["rag"]
rag = ["dep:fastembed", "dep:sqlite-vec", "dep:zerocopy"]

[dev-dependencies]
tempfile = "3"
rusqlite = { version = "0.36", features = ["bundled"] }
